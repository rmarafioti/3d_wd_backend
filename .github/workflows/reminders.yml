# Reminders: opens an issue for each routine job on a calendar or, for the code sweep and
# Documentation Sync, by merges (CLAUDE.md → Reminders), with the issue bodies in .github/reminders/.
name: Reminders

on:
  schedule:
    - cron: '0 13 1 1,4,7,10 *'
    - cron: '0 13 1 * *'
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: Which reminder to run
        type: choice
        options: [restore-drill, dependency-audit, activity]

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  restore-drill:
    if: github.event.schedule == '0 13 1 1,4,7,10 *' || inputs.job == 'restore-drill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/reminders/open.sh restore-drill "Restore drill, $(date -u +%Y)-Q$(( ($(date -u +%-m) + 2) / 3 ))" .github/reminders/restore-drill.md

  dependency-audit:
    if: github.event.schedule == '0 13 1 * *' || inputs.job == 'dependency-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # npm audit reads package-lock.json, so no install is needed. It exits 1 when it finds
      # anything, which is the case this job reports.
      - run: npm audit --json > audit.json || true

      - name: Open an issue when a moderate or worse advisory is found
        run: |
          count=$(jq '[.vulnerabilities[] | select(.severity == "moderate" or .severity == "high" or .severity == "critical")] | length' audit.json)
          if [ "$count" -eq 0 ]; then
            echo "Clean: no moderate, high or critical advisory."
            exit 0
          fi
          {
            cat .github/reminders/dependency-audit.md
            echo
            echo "## Advisories ($count packages)"
            echo
            # One line per package: its own advisories, or the packages it is vulnerable through.
            jq -r '.vulnerabilities[]
              | select(.severity == "moderate" or .severity == "high" or .severity == "critical")
              | . as $v
              | ([$v.via[] | objects | "[\(.title)](\(.url))"] | unique | join(", ")) as $advisories
              | "- **\($v.name)** (\($v.severity), \(if $v.fixAvailable then "fix available" else "no fix yet" end)): "
                + (if $advisories == "" then "through \([$v.via[] | strings] | join(", "))" else $advisories end)' audit.json
          } > body.md
          .github/reminders/open.sh audit "Dependency audit, $(date -u +%Y-%m)" body.md

  activity:
    if: github.event.schedule == '0 13 * * 1' || inputs.job == 'activity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each reminder opens only when due.sh finds merges to check (docs/process.md → Reminders). A
      # run by hand opens it whatever the count, which is still logged.
      - name: Open the Documentation Sync reminder when merges in either repo make it due
        run: |
          decision=$(.github/reminders/due.sh doc-sync "$GH_REPO" rmarafioti/3d_wd)
          if [ "$decision" = skip ] && [ "${{ github.event_name }}" = schedule ]; then
            exit 0
          fi
          .github/reminders/open.sh doc-sync "Documentation Sync, $(date -u +%Y-%m-%d)" .github/reminders/doc-sync.md

      - name: Open the code sweep reminder when due, or the quarterly full sweep
        run: |
          # The quarter's full sweep opens on the first Monday of January, April, July or October,
          # whatever was merged. While a sweep reminder is still open, open.sh skips it and the next
          # Monday of that month tries again, since no issue with its title exists yet.
          month=$(date -u +%-m)
          full_title="Full code sweep, $(date -u +%Y)-Q$(( (month + 2) / 3 ))"
          full_count=$(gh issue list --label code-sweep --state all --limit 100 --json title \
            --jq "map(select(.title == \"$full_title\")) | length")
          if [ $(( month % 3 )) -eq 1 ] && [ "$full_count" -eq 0 ]; then
            title=$full_title
            command='/code-sweep full'
          else
            decision=$(.github/reminders/due.sh code-sweep "$GH_REPO")
            if [ "$decision" = skip ] && [ "${{ github.event_name }}" = schedule ]; then
              exit 0
            fi
            title="Code sweep, $(date -u +%Y-%m-%d)"
            command='/code-sweep <the end commit of the last backend row in the Code Sweep Tracker>'
          fi
          sed "s|{{COMMAND}}|$command|" .github/reminders/code-sweep.md > body.md
          .github/reminders/open.sh code-sweep "$title" body.md
