# Local Postgres for development. Host port 5433 avoids clashing with a native Postgres on 5432.
services:
  db:
    image: postgres:17
    container_name: headless_cms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: headless_cms
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
