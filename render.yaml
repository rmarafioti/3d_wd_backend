# Render Blueprint: the API and its Postgres per environment, plus production's three cron jobs
# (docs/deploy.md → Render services).
projects:
  - name: 3dwd
    environments:
      - name: staging
        services:
          - type: web
            name: 3dwd-api-staging
            runtime: node
            plan: 0.5c-512mb
            # Next to Vercel's default functions region (iad1, Washington DC).
            region: virginia
            branch: main
            # Deploys a commit to main only after CI's check passes on it.
            autoDeployTrigger: checksPass
            # --include=dev: NODE_ENV=production is also set at build time, which makes npm omit
            # devDependencies. The Prisma CLI (postinstall generate, pre-deploy migrate) is one.
            buildCommand: npm ci --include=dev
            # Runs once per deploy, before the new version takes traffic; if it fails, the deploy
            # fails and the previous version keeps running (docs/scaling.md §7).
            preDeployCommand: npx prisma migrate deploy
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: 3dwd-db-staging
                  property: connectionString
              - key: CORS_ORIGIN
                value: https://staging.3dwebdev.com
              - key: COOKIE_DOMAIN
                value: .3dwebdev.com
              - key: CLOUDINARY_FOLDER
                value: 3dwd-dev
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: SECRET_ENCRYPTION_KEY
                sync: false
              - key: CLOUDINARY_CLOUD_NAME
                sync: false
              - key: CLOUDINARY_API_KEY
                sync: false
              - key: CLOUDINARY_API_SECRET
                sync: false
              - key: SEED_ADMIN_EMAIL
                sync: false
        databases:
          - name: 3dwd-db-staging
            databaseName: headless_cms
            # The same major version as local Docker, CI and the pg_dump / pg_restore used for
            # backups. Fixed once the database is created.
            postgresMajorVersion: '17'
            plan: 0.1c-256mb
            region: virginia
            diskSizeGB: 1
            # No connections from outside Render: the API and the Render Shell reach it on the
            # private network.
            ipAllowList: []

      - name: production
        services:
          - type: web
            name: 3dwd-api-production
            runtime: node
            plan: 0.5c-512mb
            region: virginia
            branch: production
            # The production branch only ever receives commits that already passed CI on main.
            autoDeployTrigger: checksPass
            buildCommand: npm ci --include=dev
            preDeployCommand: npx prisma migrate deploy
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: 3dwd-db-production
                  property: connectionString
              - key: CORS_ORIGIN
                value: https://3dwebdev.com
              - key: COOKIE_DOMAIN
                value: .3dwebdev.com
              - key: CLOUDINARY_FOLDER
                value: 3dwd
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: SECRET_ENCRYPTION_KEY
                sync: false
              - key: CLOUDINARY_CLOUD_NAME
                sync: false
              - key: CLOUDINARY_API_KEY
                sync: false
              - key: CLOUDINARY_API_SECRET
                sync: false
              - key: SEED_ADMIN_EMAIL
                sync: false
              # Sentry error reporting (lib/sentry.js), production only, on all four services.
              - key: SENTRY_DSN
                sync: false
              # Request emails to the admin (services/requestEmail.js), production's API only.
              - key: RESEND_API_KEY
                sync: false

          # npm run sweep:uploads: deletes Cloudinary uploads under 3dwd/ that no image row uses,
          # once they are over 24 hours old (docs/setup.md → Upload cleanup). Schedules are UTC.
          - type: cron
            name: 3dwd-sweep-uploads
            runtime: node
            plan: 0.5c-512mb
            region: virginia
            branch: production
            autoDeployTrigger: checksPass
            schedule: '0 9 * * *'
            # The Prisma CLI (a devDependency) generates the client the sweep reads image rows with.
            buildCommand: npm ci --include=dev
            startCommand: npm run sweep:uploads
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: 3dwd-db-production
                  property: connectionString
              - key: CLOUDINARY_FOLDER
                value: 3dwd
              - key: CLOUDINARY_CLOUD_NAME
                sync: false
              - key: CLOUDINARY_API_KEY
                sync: false
              - key: CLOUDINARY_API_SECRET
                sync: false
              - key: SENTRY_DSN
                sync: false

          # npm run publish:scheduled: publishes the drafts whose go-live date has passed and
          # revalidates their websites (docs/setup.md → Scheduled publish), every 15 minutes.
          - type: cron
            name: 3dwd-publish-scheduled
            runtime: node
            plan: 0.5c-512mb
            region: virginia
            branch: production
            autoDeployTrigger: checksPass
            schedule: '*/15 * * * *'
            # The Prisma CLI (a devDependency) generates the client the job reads drafts with.
            buildCommand: npm ci --include=dev
            startCommand: npm run publish:scheduled
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: 3dwd-db-production
                  property: connectionString
              - key: SECRET_ENCRYPTION_KEY
                sync: false
              - key: SENTRY_DSN
                sync: false

          # npm run backup:database: an encrypted pg_dump uploaded to R2, nightly. In Docker for
          # pg_dump 17 (Dockerfile.backup). An hour before the sweep, so the two never overlap.
          - type: cron
            name: 3dwd-backup-database
            runtime: docker
            dockerfilePath: ./Dockerfile.backup
            plan: 0.5c-512mb
            region: virginia
            branch: production
            autoDeployTrigger: checksPass
            schedule: '0 8 * * *'
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: 3dwd-db-production
                  property: connectionString
              - key: R2_BUCKET
                value: 3dwd-backups
              # The backup public key's PEM, base64 on one line. Public, but kept with the secrets
              # so a key rotation needs no PR.
              - key: BACKUP_PUBLIC_KEY
                sync: false
              - key: R2_ACCOUNT_ID
                sync: false
              - key: R2_ACCESS_KEY_ID
                sync: false
              - key: R2_SECRET_ACCESS_KEY
                sync: false
              - key: SENTRY_DSN
                sync: false
        databases:
          - name: 3dwd-db-production
            databaseName: headless_cms
            postgresMajorVersion: '17'
            plan: 0.1c-256mb
            region: virginia
            diskSizeGB: 1
            ipAllowList: []
